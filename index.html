<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Основи та принципи Радіорозвідки</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; padding: 20px; color: #333; margin: 0; }
        .quiz-container { max-width: 650px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); margin: 20px auto; }
        .header-panel { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f1f1; padding-bottom: 15px; margin-bottom: 20px; }
        .timer-box { font-size: 18px; font-weight: bold; color: #d9534f; background: #fdf7f7; padding: 8px 15px; border-radius: 6px; border: 1px solid #f5c6cb; }
        .progress { color: #777; font-size: 14px; }
        .question-title { font-size: 18px; margin-bottom: 20px; line-height: 1.4; font-weight: 600; }
        .btn { display: block; width: 100%; padding: 14px; margin: 10px 0; background: #f8f9fa; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; text-align: left; font-size: 16px; transition: all 0.2s; box-sizing: border-box; }
        .btn:hover { background: #edf2f7; border-color: #cbd5e0; }
        .hidden { display: none; }
        .result-title { color: #2b6cb0; text-align: center; }
        .result-score { font-size: 24px; font-weight: bold; text-align: center; margin: 20px 0; color: #2f855a; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-zone">
        <div class="header-panel">
            <div class="progress">Запитання <span id="current-num">1</span> з 30</div>
            <div class="timer-box">⏱️ <span id="timer-display">30:00</span></div>
        </div>
        <div class="question-title" id="question-text">Завантаження питань...</div>
        <div id="answers-zone"></div>
    </div>
    
    <div id="result-zone" class="hidden">
        <h2 class="result-title">Тест завершено!</h2>
        <div class="result-score" id="score-text"></div>
        <p style="text-align:center; color:#4a5568;">Всі 30 питань пройдено. Тест завершено успішно.</p>
        <button class="btn" style="text-align:center; background:#3182ce; color:white; font-weight:bold; margin-top:20px;" onclick="location.reload()">Пройти знову</button>
    </div>
</div>

<script>
